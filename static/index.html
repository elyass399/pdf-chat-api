<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PDF Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f5f5f5;
      color: #1a1a1a;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    nav {
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      padding: 0 32px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 16px;
    }

    .nav-logo .dot {
      width: 28px;
      height: 28px;
      background: #000;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 14px;
    }

    .nav-tabs {
      display: flex;
      gap: 32px;
    }

    .nav-tabs a {
      text-decoration: none;
      font-size: 14px;
      color: #666;
      padding-bottom: 4px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }

    .nav-tabs a.active {
      color: #000;
      font-weight: 600;
      border-bottom: 2px solid #000;
    }

    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* SIDEBAR */
    .sidebar {
      width: 300px;
      background: #fff;
      border-right: 1px solid #e0e0e0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      overflow-y: auto;
    }

    .sidebar h3 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: #999;
      font-weight: 600;
    }

    label { font-size: 13px; color: #444; display: block; margin-bottom: 6px; }

    input[type="text"], input[type="password"] {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 9px 12px;
      font-size: 13px;
      color: #1a1a1a;
      outline: none;
      background: #fafafa;
    }

    input:focus { border-color: #999; background: #fff; }

    .upload-box {
      border: 1.5px dashed #ccc;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      background: #fafafa;
      transition: border-color 0.2s;
    }

    .upload-box:hover { border-color: #888; }
    .upload-box input { display: none; }
    .upload-box .icon { font-size: 24px; margin-bottom: 8px; }
    .upload-box p { font-size: 12px; color: #888; }
    .upload-box .filename { font-size: 12px; color: #333; margin-top: 4px; font-weight: 500; }

    .btn {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: opacity 0.2s, background 0.2s;
    }

    .btn-dark { background: #1a1a1a; color: #fff; }
    .btn-dark:hover { background: #333; }
    .btn-outline { background: #fff; color: #333; border: 1px solid #ddd; }
    .btn-outline:hover { background: #f5f5f5; }

    .status {
      font-size: 12px;
      padding: 8px 12px;
      border-radius: 6px;
      display: none;
      text-align: center;
    }

    .status.success { background: #f0faf0; color: #2e7d32; border: 1px solid #c8e6c9; display: block; }
    .status.error { background: #fff0f0; color: #c62828; border: 1px solid #ffcdd2; display: block; }
    .status.loading { background: #f0f4ff; color: #1565c0; border: 1px solid #c5cae9; display: block; }

    .divider { border: none; border-top: 1px solid #e0e0e0; }

    /* PANELS */
    .panel { flex: 1; display: none; flex-direction: column; overflow: hidden; background: #fff; }
    .panel.active { display: flex; }

    /* CHAT */
    .chat-header {
      padding: 14px 28px;
      border-bottom: 1px solid #e0e0e0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge {
      background: #f0f0f0;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 4px 12px;
      font-size: 12px;
      color: #444;
      font-weight: 500;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #bbb;
      gap: 10px;
    }

    .empty-state .icon { font-size: 40px; }
    .empty-state p { font-size: 14px; }

    .message-group { display: flex; flex-direction: column; gap: 4px; }

    .message-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #999;
    }

    .message-bubble {
      padding: 14px 18px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.7;
      max-width: 80%;
    }

    .message-bubble.user {
      background: #e8f5e9;
      color: #1a1a1a;
      align-self: flex-end;
      border: 1px solid #c8e6c9;
    }

    .message-bubble.assistant {
      background: #f8f8f8;
      color: #1a1a1a;
      align-self: flex-start;
      border: 1px solid #e0e0e0;
    }

    .message-bubble.thinking {
      background: #f0f4ff;
      color: #666;
      align-self: flex-start;
      border: 1px solid #c5cae9;
      font-style: italic;
    }

    .input-row {
      padding: 16px 28px;
      border-top: 1px solid #e0e0e0;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      background: #fff;
    }

    .input-row textarea {
      flex: 1;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      resize: none;
      height: 48px;
      line-height: 1.5;
      background: #fafafa;
    }

    .input-row textarea:focus { border-color: #999; background: #fff; }

    .action-btns { display: flex; gap: 8px; }

    .action-btn {
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid #ddd;
      background: #fff;
      color: #333;
      transition: background 0.2s;
      white-space: nowrap;
    }

    .action-btn:hover { background: #f5f5f5; }
    .action-btn.primary { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
    .action-btn.primary:hover { background: #333; }
    .action-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* KNOWLEDGE BASE */
    .kb-header {
      padding: 24px 28px 0;
      border-bottom: 1px solid #e0e0e0;
    }

    .kb-header h2 { font-size: 20px; font-weight: 700; margin-bottom: 16px; }

    .kb-content { padding: 24px 28px; overflow-y: auto; flex: 1; }

    .kb-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #bbb;
      gap: 10px;
    }

    .kb-empty .icon { font-size: 40px; }
    .kb-empty p { font-size: 14px; }

    .doc-list { display: flex; flex-direction: column; gap: 10px; }

    .doc-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 18px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      background: #fafafa;
      transition: background 0.2s;
    }

    .doc-item:hover { background: #f0f0f0; }

    .doc-icon {
      width: 36px;
      height: 36px;
      background: #fee2e2;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .doc-name { font-size: 14px; font-weight: 500; color: #1a1a1a; }
    .doc-meta { font-size: 12px; color: #999; margin-top: 2px; }
  </style>
</head>
<body>

<nav>
  <div class="nav-logo">
    <div class="dot">📄</div>
    PDF Chat
  </div>
  <div class="nav-tabs">
    <a class="active" onclick="switchTab('converse', this)">Converse</a>
    <a onclick="switchTab('knowledge', this)">Knowledge Base</a>
  </div>
</nav>

<div class="main">
  <!-- SIDEBAR -->
  <div class="sidebar">
    <h3>Configuration</h3>
    <div>
      <label>API Key</label>
      <input type="password" id="apiKey" placeholder="Enter your API key" />
    </div>

    <hr class="divider" />

    <h3>Upload PDF</h3>
    <label class="upload-box" for="fileInput">
      <div class="icon">📁</div>
      <p>Click to select a PDF</p>
      <div class="filename" id="fileName"></div>
      <input type="file" id="fileInput" accept=".pdf" onchange="updateFileName(this)" />
    </label>

    <button class="btn btn-dark" onclick="uploadPDF()">Upload PDF</button>
    <div class="status" id="uploadStatus"></div>

    <hr class="divider" />
    <button class="btn btn-outline" onclick="clearChat()">Clear Chat</button>
  </div>

  <!-- CONVERSE PANEL -->
  <div class="panel active" id="panel-converse">
    <div class="chat-header">
      <span class="badge">gemini-2.5-flash</span>
      <span class="badge">qdrant · pdf_docs</span>
    </div>

    <div class="messages" id="messages">
      <div class="empty-state" id="emptyState">
        <div class="icon">💬</div>
        <p>Upload a PDF and start asking questions</p>
      </div>
    </div>

    <div class="input-row">
      <textarea id="questionInput" placeholder="Enter text and press ENTER or Submit..." onkeydown="if(event.key==='Enter' && !event.shiftKey){ event.preventDefault(); sendMessage(); }"></textarea>
      <div class="action-btns">
        <button class="action-btn primary" id="sendBtn" onclick="sendMessage()">Submit</button>
        <button class="action-btn" onclick="clearChat()">Clear</button>
      </div>
    </div>
  </div>

  <!-- KNOWLEDGE BASE PANEL -->
  <div class="panel" id="panel-knowledge">
    <div class="kb-header">
      <h2>Knowledge Base</h2>
    </div>
    <div class="kb-content">
      <div class="kb-empty" id="kbEmpty">
        <div class="icon">📚</div>
        <p>No documents uploaded yet</p>
      </div>
      <div class="doc-list" id="docList" style="display:none;"></div>
    </div>
  </div>
</div>

<script>
  function switchTab(tab, el) {
    document.querySelectorAll('.nav-tabs a').forEach(a => a.classList.remove('active'));
    el.classList.add('active');
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.getElementById('panel-' + tab).classList.add('active');
    if (tab === 'knowledge') loadDocuments();
  }

  function updateFileName(input) {
    document.getElementById('fileName').textContent = input.files[0]?.name || '';
  }

  function getApiKey() {
    return document.getElementById('apiKey').value.trim();
  }

  function setStatus(id, msg, type) {
    const el = document.getElementById(id);
    el.textContent = msg;
    el.className = `status ${type}`;
  }

  function addMessage(text, role) {
    const empty = document.getElementById('emptyState');
    if (empty) empty.remove();

    const group = document.createElement('div');
    group.className = 'message-group';

    const label = document.createElement('div');
    label.className = 'message-label';
    label.textContent = role === 'user' ? 'You' : 'Assistant';
    label.style.alignSelf = role === 'user' ? 'flex-end' : 'flex-start';

    const bubble = document.createElement('div');
    bubble.className = `message-bubble ${role}`;
    bubble.textContent = text;

    group.appendChild(label);
    group.appendChild(bubble);

    const messages = document.getElementById('messages');
    messages.appendChild(group);
    messages.scrollTop = messages.scrollHeight;
    return bubble;
  }

  async function uploadPDF() {
    const file = document.getElementById('fileInput').files[0];
    const apiKey = getApiKey();
    if (!apiKey) return setStatus('uploadStatus', 'Enter your API key first', 'error');
    if (!file) return setStatus('uploadStatus', 'Select a PDF first', 'error');

    setStatus('uploadStatus', 'Uploading...', 'loading');
    const form = new FormData();
    form.append('file', file);

    try {
      const res = await fetch('/upload', {
        method: 'POST',
        headers: { 'x-api-key': apiKey },
        body: form
      });
      const data = await res.json();
      if (res.ok) setStatus('uploadStatus', '✓ ' + data.message, 'success');
      else setStatus('uploadStatus', data.detail || 'Upload failed', 'error');
    } catch (e) {
      setStatus('uploadStatus', 'Connection error', 'error');
    }
  }

  async function loadDocuments() {
    const apiKey = getApiKey();
    if (!apiKey) return;

    try {
      const res = await fetch('/documents', { headers: { 'x-api-key': apiKey } });
      const data = await res.json();
      const docs = data.documents || [];

      const kbEmpty = document.getElementById('kbEmpty');
      const docList = document.getElementById('docList');

      if (docs.length === 0) {
        kbEmpty.style.display = 'flex';
        docList.style.display = 'none';
        return;
      }

      kbEmpty.style.display = 'none';
      docList.style.display = 'flex';
      docList.innerHTML = docs.map(name => `
        <div class="doc-item">
          <div class="doc-icon">📄</div>
          <div>
            <div class="doc-name">${name}</div>
            <div class="doc-meta">PDF · In knowledge base</div>
          </div>
        </div>
      `).join('');
    } catch (e) {
      console.error('Failed to load documents', e);
    }
  }

  async function sendMessage() {
    const input = document.getElementById('questionInput');
    const question = input.value.trim();
    const apiKey = getApiKey();
    if (!apiKey) return alert('Enter your API key first');
    if (!question) return;

    input.value = '';
    document.getElementById('sendBtn').disabled = true;

    addMessage(question, 'user');
    const thinking = addMessage('Thinking...', 'thinking');

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-api-key': apiKey },
        body: JSON.stringify({ question })
      });
      const data = await res.json();
      thinking.textContent = res.ok ? data.answer : 'Error: ' + (data.detail || 'Something went wrong');
      thinking.className = `message-bubble ${res.ok ? 'assistant' : 'assistant'}`;
    } catch (e) {
      thinking.textContent = 'Connection error';
    }

    document.getElementById('sendBtn').disabled = false;
    input.focus();
  }

  function clearChat() {
    document.getElementById('messages').innerHTML = '<div class="empty-state" id="emptyState"><div class="icon">💬</div><p>Upload a PDF and start asking questions</p></div>';
  }
</script>

</body>
</html>
